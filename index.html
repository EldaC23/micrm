<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini CRM Interactivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Librería para procesar archivos CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-chart-kanban text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">CRM Prospectos</h1>
          <p class="text-xs text-slate-400">Gestor de Embudos, Nichos & Contactos</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3 w-full sm:w-auto justify-end flex-wrap">
        <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileSelect(event)">
        
        <button onclick="document.getElementById('csvFileInput').click()" class="bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium px-3.5 py-2 rounded-lg text-sm transition-all duration-200 flex items-center gap-2 border border-slate-600">
          <i class="fa-solid fa-file-csv text-emerald-400"></i> Importar CSV/Excel
        </button>

        <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all duration-200 flex items-center gap-2 shadow-lg shadow-indigo-600/20 active:scale-95">
          <i class="fa-solid fa-plus"></i> Nuevo Lead
        </button>
      </div>
    </div>
  </header>

  <!-- Metrics Dashboard Bar -->
  <section class="bg-slate-800/50 border-b border-slate-700/60 py-3 px-4">
    <div class="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 text-center sm:text-left">
      <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/80">
        <p class="text-xs text-slate-400 font-medium">Total Prospectos</p>
        <p id="stat-total" class="text-lg font-bold text-slate-100">0</p>
      </div>
      <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/80">
        <p class="text-xs text-slate-400 font-medium">Valor en Pipeline</p>
        <p id="stat-value" class="text-lg font-bold text-emerald-400">$0</p>
      </div>
      <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/80">
        <p class="text-xs text-slate-400 font-medium">Cierres Ganados</p>
        <p id="stat-won" class="text-lg font-bold text-indigo-400">0</p>
      </div>
      <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/80">
        <p class="text-xs text-slate-400 font-medium">Tasa Conversión</p>
        <p id="stat-rate" class="text-lg font-bold text-amber-400">0%</p>
      </div>
    </div>
  </section>

  <!-- Main Content: Kanban Board -->
  <main class="flex-1 p-4 md:p-6 overflow-x-auto custom-scrollbar max-w-7xl mx-auto w-full">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-5 min-w-[800px] h-full items-start">

      <!-- Column: Contacto Inicial -->
      <div class="bg-slate-800/70 border border-slate-700/80 rounded-xl p-4 flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-blue-500/30">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500 shadow-sm shadow-blue-500/50"></span>
            <h2 class="font-semibold text-sm text-blue-300">Contacto Inicial</h2>
          </div>
          <span id="count-nuevo" class="text-xs bg-blue-500/20 text-blue-300 border border-blue-500/30 font-semibold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-nuevo" class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'nuevo')"></div>
      </div>

      <!-- Column: Propuesta / Demo -->
      <div class="bg-slate-800/70 border border-slate-700/80 rounded-xl p-4 flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-amber-500/30">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50"></span>
            <h2 class="font-semibold text-sm text-amber-300">Propuesta / Demo</h2>
          </div>
          <span id="count-propuesta" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 font-semibold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-propuesta" class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'propuesta')"></div>
      </div>

      <!-- Column: Negociación -->
      <div class="bg-slate-800/70 border border-slate-700/80 rounded-xl p-4 flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-purple-500/30">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-500 shadow-sm shadow-purple-500/50"></span>
            <h2 class="font-semibold text-sm text-purple-300">Negociación</h2>
          </div>
          <span id="count-negociacion" class="text-xs bg-purple-500/20 text-purple-300 border border-purple-500/30 font-semibold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-negociacion" class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'negociacion')"></div>
      </div>

      <!-- Column: Ganado -->
      <div class="bg-slate-800/70 border border-slate-700/80 rounded-xl p-4 flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-emerald-500/30">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
            <h2 class="font-semibold text-sm text-emerald-300">Cierre / Ganado</h2>
          </div>
          <span id="count-ganado" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-semibold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-ganado" class="space-y-3 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'ganado')"></div>
      </div>

    </div>
  </main>

  <!-- Modal: Crear / Editar Lead -->
  <div id="leadModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl shadow-2xl p-6 relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 id="modalTitle" class="text-lg font-bold text-white mb-4">Agregar Nuevo Prospecto</h3>
      
      <form id="leadForm" onsubmit="saveLead(event)" class="space-y-4">
        <input type="hidden" id="leadId">
        
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Nombre o Empresa *</label>
          <input type="text" id="leadName" required placeholder="Ej: Clínica Dental San José" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Teléfono / WhatsApp *</label>
          <input type="text" id="leadPhone" required placeholder="Ej: +584121234567" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Categoría / Nicho</label>
            <select id="leadCategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="Salud">🩺 Salud / Médico</option>
              <option value="Gastronomía">🍕 Gastronomía</option>
              <option value="Comercio">🛍️ Comercio / Tienda</option>
              <option value="Servicios">💼 Servicios Prof.</option>
              <option value="General">📌 General</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Valor Est. ($)</label>
            <input type="number" id="leadValue" min="0" placeholder="Ej: 350" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Etapa Inicial</label>
          <select id="leadStage" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="nuevo">Contacto Inicial</option>
            <option value="propuesta">Propuesta / Demo</option>
            <option value="negociacion">Negociación</option>
            <option value="ganado">Cierre / Ganado</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Notas / Detalles</label>
          <textarea id="leadNotes" rows="2" placeholder="Ej: Interesado en landing page y menú interactivo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg shadow-md">Guardar Prospecto</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let leads = JSON.parse(localStorage.getItem('crm_leads_data')) || [
      { id: '1', name: 'Centro Médico Vista', phone: '+584120001122', value: 450, stage: 'nuevo', category: 'Salud', notes: 'Consultó por demo de agenda médica digital' },
      { id: '2', name: 'Pizza Express', phone: '+584149998877', value: 200, stage: 'propuesta', category: 'Gastronomía', notes: 'Se le envió propuesta de menú interactivo QR' },
      { id: '3', name: 'Dra. María Ramos', phone: '+584241112233', value: 350, stage: 'negociacion', category: 'Salud', notes: 'Revisando alcance de landing page ginecológica' },
      { id: '4', name: 'Boutique Besitos', phone: '+584125554433', value: 180, stage: 'ganado', category: 'Comercio', notes: 'Pago inicial recibido. En etapa de diseño' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderBoard();
    });

    function saveData() {
      localStorage.setItem('crm_leads_data', JSON.stringify(leads));
      renderBoard();
    }

    function renderBoard() {
      const stages = ['nuevo', 'propuesta', 'negociacion', 'ganado'];
      
      stages.forEach(stage => {
        const col = document.getElementById(`col-${stage}`);
        if(col) col.innerHTML = '';
      });

      let totalVal = 0;
      let countWon = 0;

      leads.forEach(lead => {
        totalVal += Number(lead.value || 0);
        if (lead.stage === 'ganado') countWon++;

        const card = createCardElement(lead);
        const col = document.getElementById(`col-${lead.stage}`);
        if (col) col.appendChild(card);
      });

      stages.forEach(stage => {
        const count = leads.filter(l => l.stage === stage).length;
        const elem = document.getElementById(`count-${stage}`);
        if(elem) elem.innerText = count;
      });

      document.getElementById('stat-total').innerText = leads.length;
      document.getElementById('stat-value').innerText = `$${totalVal.toLocaleString()}`;
      document.getElementById('stat-won').innerText = countWon;
      
      const rate = leads.length > 0 ? Math.round((countWon / leads.length) * 100) : 0;
      document.getElementById('stat-rate').innerText = `${rate}%`;
    }

    function createCardElement(lead) {
      const card = document.createElement('div');
      
      // Dynamic styles per stage
      let stageStyles = "bg-blue-950/40 border-blue-500/40 hover:border-blue-400";
      if (lead.stage === 'propuesta') stageStyles = "bg-amber-950/40 border-amber-500/40 hover:border-amber-400";
      if (lead.stage === 'negociacion') stageStyles = "bg-purple-950/40 border-purple-500/40 hover:border-purple-400";
      if (lead.stage === 'ganado') stageStyles = "bg-emerald-950/40 border-emerald-500/40 hover:border-emerald-400";

      card.className = `${stageStyles} border rounded-xl p-3.5 shadow-md transition-all cursor-grab active:cursor-grabbing group relative`;
      card.draggable = true;
      card.ondragstart = (e) => drag(e, lead.id);

      const cleanPhone = String(lead.phone || '').replace(/[^0-9]/g, '');
      const waUrl = `https://wa.me/${cleanPhone}`;
      const category = lead.category || 'General';

      card.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-1.5">
          <span class="text-[10px] uppercase tracking-wider font-semibold bg-slate-800/80 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md">
            ${escapeHtml(category)}
          </span>
          <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100">
            <button onclick="editLead('${lead.id}')" class="text-xs text-slate-400 hover:text-slate-200 p-1" title="Editar">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="deleteLead('${lead.id}')" class="text-xs text-slate-400 hover:text-red-400 p-1" title="Eliminar">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>

        <h4 class="font-semibold text-sm text-slate-100 group-hover:text-white transition-colors leading-snug mb-1">${escapeHtml(lead.name)}</h4>
        
        ${lead.notes ? `<p class="text-xs text-slate-400 mb-3 line-clamp-2 leading-relaxed">${escapeHtml(lead.notes)}</p>` : ''}
        
        <div class="flex items-center justify-between pt-2 border-t border-slate-700/50 text-xs">
          <span class="font-bold text-emerald-400">$${Number(lead.value || 0).toLocaleString()}</span>
          
          <div class="flex items-center gap-2">
            <a href="${waUrl}" target="_blank" class="inline-flex items-center gap-1 bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 px-2 py-1 rounded border border-emerald-500/40 font-medium transition-colors">
              <i class="fa-brands fa-whatsapp"></i> Chat
            </a>
            
            <select onchange="moveLead('${lead.id}', this.value)" class="bg-slate-900 text-slate-300 border border-slate-700 rounded px-1.5 py-0.5 text-[11px] focus:outline-none">
              <option value="nuevo" ${lead.stage === 'nuevo' ? 'selected' : ''}>Contacto</option>
              <option value="propuesta" ${lead.stage === 'propuesta' ? 'selected' : ''}>Demo</option>
              <option value="negociacion" ${lead.stage === 'negociacion' ? 'selected' : ''}>Negociación</option>
              <option value="ganado" ${lead.stage === 'ganado' ? 'selected' : ''}>Ganado</option>
            </select>
          </div>
        </div>
      `;

      return card;
    }

    // CSV Import Handler
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          let countAdded = 0;
          
          results.data.forEach(row => {
            const name = row.Nombre || row.nombre || row.Empresa || row.empresa || row.Cliente || row.cliente;
            const phone = row.Telefono || row.telefono || row.Celular || row.celular || row.WhatsApp || row.whatsapp || row.Phone;
            const value = row.Valor || row.valor || row.Monto || row.monto || 0;
            const category = row.Categoria || row.categoria || row.Nicho || row.nicho || 'General';
            const notes = row.Notas || row.notas || row.Detalles || row.detalles || '';

            if (name && phone) {
              leads.push({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                name: String(name).trim(),
                phone: String(phone).trim(),
                value: Number(value) || 0,
                category: String(category).trim(),
                stage: 'nuevo',
                notes: String(notes).trim()
              });
              countAdded++;
            }
          });

          if (countAdded > 0) {
            saveData();
            alert(`¡Se importaron con éxito ${countAdded} prospectos al CRM!`);
          } else {
            alert('No se encontraron filas válidas. Revisa que tu archivo tenga columnas con nombres como "Nombre" y "Telefono".');
          }
          
          event.target.value = '';
        },
        error: function(err) {
          alert('Hubo un error al leer el archivo CSV.');
        }
      });
    }

    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev, id) { ev.dataTransfer.setData("text/plain", id); }
    function drop(ev, newStage) {
      ev.preventDefault();
      const id = ev.dataTransfer.getData("text/plain");
      moveLead(id, newStage);
    }

    function moveLead(id, newStage) {
      leads = leads.map(l => l.id === id ? { ...l, stage: newStage } : l);
      saveData();
    }

    function openModal() {
      document.getElementById('leadForm').reset();
      document.getElementById('leadId').value = '';
      document.getElementById('modalTitle').innerText = 'Agregar Nuevo Prospecto';
      document.getElementById('leadModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('leadModal').classList.add('hidden');
    }

    function editLead(id) {
      const lead = leads.find(l => l.id === id);
      if (!lead) return;

      document.getElementById('leadId').value = lead.id;
      document.getElementById('leadName').value = lead.name;
      document.getElementById('leadPhone').value = lead.phone;
      document.getElementById('leadValue').value = lead.value;
      document.getElementById('leadCategory').value = lead.category || 'General';
      document.getElementById('leadStage').value = lead.stage;
      document.getElementById('leadNotes').value = lead.notes || '';

      document.getElementById('modalTitle').innerText = 'Editar Prospecto';
      document.getElementById('leadModal').classList.remove('hidden');
    }

    function saveLead(e) {
      e.preventDefault();
      const id = document.getElementById('leadId').value;
      const name = document.getElementById('leadName').value;
      const phone = document.getElementById('leadPhone').value;
      const value = document.getElementById('leadValue').value;
      const category = document.getElementById('leadCategory').value;
      const stage = document.getElementById('leadStage').value;
      const notes = document.getElementById('leadNotes').value;

      if (id) {
        leads = leads.map(l => l.id === id ? { ...l, name, phone, value, category, stage, notes } : l);
      } else {
        leads.push({
          id: Date.now().toString(),
          name,
          phone,
          value,
          category,
          stage,
          notes
        });
      }

      saveData();
      closeModal();
    }

    function deleteLead(id) {
      if (confirm('¿Estás seguro de que deseas eliminar este prospecto?')) {
        leads = leads.filter(l => l.id !== id);
        saveData();
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text || '').replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
