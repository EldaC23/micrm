<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini CRM Interactivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
      border-radius: 99px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 99px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body class="bg-[#F6F8FA] text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header / Navbar -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 p-4 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      
      <!-- Brand Logo & Title -->
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center space-x-3">
          <div class="bg-gradient-to-tr from-fuchsia-500 to-indigo-500 p-3 rounded-2xl shadow-md text-white">
            <i class="fa-solid fa-chart-kanban text-lg"></i>
          </div>
          <div>
            <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">CRM Prospectos</h1>
            <p class="text-xs font-medium text-slate-400">Embudos, Categorías & WhatsApp</p>
          </div>
        </div>
      </div>

      <!-- Live Search & Category Filter Bar -->
      <div class="flex flex-col sm:flex-row items-center gap-2.5 w-full sm:w-auto flex-1 max-w-xl justify-center">
        <!-- Filter by Category -->
        <div class="relative w-full sm:w-48">
          <i class="fa-solid fa-filter absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <select id="categoryFilter" onchange="renderBoard()" class="w-full bg-slate-100/80 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-fuchsia-300 rounded-2xl pl-9 pr-3 py-2 text-xs font-bold text-slate-700 focus:outline-none transition-all shadow-inner cursor-pointer appearance-none">
            <option value="ALL">Todas las Categorías</option>
            <option value="Gastronomía">🍕 Gastronomía / Menús</option>
            <option value="Salud">🩺 Salud / Médico</option>
            <option value="Entretenimiento">🎭 Entretenimiento</option>
            <option value="Comercio">🛍️ Comercio / Tienda</option>
            <option value="Servicios">💼 Servicios Prof.</option>
            <option value="Comidas">🍔 Comidas Rápida</option>
            <option value="General">📌 General</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
        </div>

        <!-- Live Search Bar -->
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" oninput="renderBoard()" placeholder="Buscar prospecto, teléfono, instagram..." class="w-full bg-slate-100/80 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-fuchsia-300 rounded-2xl pl-9 pr-8 py-2 text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all shadow-inner">
          <button onclick="clearSearch()" id="clearSearchBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs hidden">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3 w-full sm:w-auto justify-end flex-wrap">
        <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileSelect(event)">
        
        <button onclick="document.getElementById('csvFileInput').click()" class="bg-slate-100 hover:bg-slate-200/80 text-slate-700 font-semibold px-4 py-2.5 rounded-2xl text-xs transition-all duration-200 flex items-center gap-2 active:scale-95">
          <i class="fa-solid fa-file-csv text-emerald-500 text-sm"></i> Importar Excel
        </button>

        <button onclick="openModal()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2.5 rounded-2xl text-xs transition-all duration-200 flex items-center gap-2 shadow-lg shadow-slate-900/10 active:scale-95">
          <i class="fa-solid fa-plus text-xs"></i> Nuevo Lead
        </button>
      </div>
    </div>
  </header>

  <!-- Metrics Dashboard Bar -->
  <section class="py-4 px-4 max-w-[1600px] mx-auto w-full">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-semibold">Leads (Filtrados)</p>
          <p id="stat-total" class="text-xl font-extrabold text-slate-800 mt-0.5">0</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-fuchsia-50 text-fuchsia-500 flex items-center justify-center font-bold">
          <i class="fa-solid fa-users text-sm"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-semibold">Valor Pipeline</p>
          <p id="stat-value" class="text-xl font-extrabold text-emerald-600 mt-0.5">$0</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center font-bold">
          <i class="fa-solid fa-sack-dollar text-sm"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-semibold">Ganados</p>
          <p id="stat-won" class="text-xl font-extrabold text-indigo-600 mt-0.5">0</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-500 flex items-center justify-center font-bold">
          <i class="fa-solid fa-trophy text-sm"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-semibold">Conversión</p>
          <p id="stat-rate" class="text-xl font-extrabold text-amber-500 mt-0.5">0%</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center font-bold">
          <i class="fa-solid fa-chart-line text-sm"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content: Horizontal Scroll Kanban Board (7 Columns) -->
  <main class="flex-1 px-4 pb-6 overflow-x-auto custom-scrollbar max-w-[1600px] mx-auto w-full">
    <div class="flex gap-4 min-w-max items-start pb-4">

      <!-- Column 1: Por Contactar -->
      <div class="w-[270px] flex-shrink-0 bg-slate-200/50 p-3.5 rounded-[28px] flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between px-2 py-2 mb-2">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-fuchsia-500"></div>
            <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider">Por Contactar</h2>
          </div>
          <span id="count-sin_contactar" class="text-xs bg-white text-slate-700 font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
        </div>
        <div id="col-sin_contactar" class="space-y-3.5 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'sin_contactar')"></div>
      </div>

      <!-- Column 2: Contacto Inicial -->
      <div class="w-[270px] flex-shrink-0 bg-slate-200/50 p-3.5 rounded-[28px] flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between px-2 py-2 mb-2">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-indigo-500"></div>
            <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider">Contacto Inicial</h2>
          </div>
          <span id="count-nuevo" class="text-xs bg-white text-slate-700 font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
        </div>
        <div id="col-nuevo" class="space-y-3.5 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'nuevo')"></div>
      </div>

      <!-- Column 3: Seguimiento (Interno 1 y 2) -->
      <div class="w-[270px] flex-shrink-0 bg-slate-200/50 p-3.5 rounded-[28px] flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between px-2 py-2 mb-2">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-sky-500"></div>
            <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider">Seguimiento</h2>
          </div>
          <span id="count-seguimiento" class="text-xs bg-white text-slate-700 font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
        </div>
        <div id="col-seguimiento" class="space-y-3.5 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'seguimiento')"></div>
      </div>

      <!-- Column 4: Propuesta / Demo -->
      <div class="w-[270px] flex-shrink-0 bg-slate-200/50 p-3.5 rounded-[28px] flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between px-2 py-2 mb-2">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
            <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider">Propuesta / Demo</h2>
          </div>
          <span id="count-propuesta" class="text-xs bg-white text-slate-700 font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
        </div>
        <div id="col-propuesta" class="space-y-3.5 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'propuesta')"></div>
      </div>

      <!-- Column 5: Negociación -->
      <div class="w-[270px] flex-shrink-0 bg-slate-200/50 p-3.5 rounded-[28px] flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between px-2 py-2 mb-2">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
            <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider">Negociación</h2>
          </div>
          <span id="count-negociacion" class="text-xs bg-white text-slate-700 font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
        </div>
        <div id="col-negociacion" class="space-y-3.5 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'negociacion')"></div>
      </div>

      <!-- Column 6: Ganado -->
      <div class="w-[270px] flex-shrink-0 bg-slate-200/50 p-3.5 rounded-[28px] flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between px-2 py-2 mb-2">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-rose-500"></div>
            <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider">Ganado</h2>
          </div>
          <span id="count-ganado" class="text-xs bg-white text-slate-700 font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
        </div>
        <div id="col-ganado" class="space-y-3.5 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'ganado')"></div>
      </div>

      <!-- Column 7: Sin Respuesta / Archivado -->
      <div class="w-[270px] flex-shrink-0 bg-slate-200/50 p-3.5 rounded-[28px] flex flex-col max-h-[75vh]">
        <div class="flex items-center justify-between px-2 py-2 mb-2">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div>
            <h2 class="font-bold text-xs text-slate-600 uppercase tracking-wider">Sin Respuesta</h2>
          </div>
          <span id="count-sin_respuesta" class="text-xs bg-white text-slate-600 font-bold px-2 py-0.5 rounded-full shadow-sm">0</span>
        </div>
        <div id="col-sin_respuesta" class="space-y-3.5 overflow-y-auto custom-scrollbar flex-1 pr-1 min-h-[150px]" ondragover="allowDrop(event)" ondrop="drop(event, 'sin_respuesta')"></div>
      </div>

    </div>
  </main>

  <!-- Modal: Crear / Editar Lead -->
  <div id="leadModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-md rounded-[32px] shadow-2xl p-6 relative border border-slate-100">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 id="modalTitle" class="text-lg font-extrabold text-slate-900 mb-4">Agregar Nuevo Prospecto</h3>
      
      <form id="leadForm" onsubmit="saveLead(event)" class="space-y-4">
        <input type="hidden" id="leadId">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre o Empresa *</label>
          <input type="text" id="leadName" required placeholder="Ej: Pizzería Gran Plaza" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono / WhatsApp *</label>
            <input type="text" id="leadPhone" required placeholder="Ej: +584121234567" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Instagram / Redes</label>
            <input type="text" id="leadInstagram" placeholder="Ej: @pizzeriagranplaza" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Categoría / Nicho</label>
            <select id="leadCategory" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 text-xs font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
              <option value="Gastronomía">🍕 Gastronomía / Menús</option>
              <option value="Salud">🩺 Salud / Médico</option>
              <option value="Entretenimiento">🎭 Entretenimiento</option>
              <option value="Comercio">🛍️ Comercio / Tienda</option>
              <option value="Servicios">💼 Servicios Prof.</option>
              <option value="Comidas">🍔 Comidas Rápida</option>
              <option value="General">📌 General</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Valor Est. ($)</label>
            <input type="number" id="leadValue" min="0" placeholder="Ej: 350" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Etapa Inicial</label>
            <select id="leadStage" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 text-xs font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
              <option value="sin_contactar">Por Contactar</option>
              <option value="nuevo">Contacto Inicial</option>
              <option value="seguimiento">Seguimiento</option>
              <option value="propuesta">Propuesta / Demo</option>
              <option value="negociacion">Negociación</option>
              <option value="ganado">Ganado</option>
              <option value="sin_respuesta">Sin Respuesta</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nivel Seguimiento</label>
            <select id="leadFollowStep" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 text-xs font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400">
              <option value="1">Seguimiento 1</option>
              <option value="2">Seguimiento 2</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Notas / Detalles</label>
          <textarea id="leadNotes" rows="2" placeholder="Ej: Interesado en menú interactivo con código QR" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-2xl">Cancelar</button>
          <button type="submit" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-2xl shadow-md">Guardar Prospecto</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let leads = JSON.parse(localStorage.getItem('crm_leads_data')) || [];

    document.addEventListener('DOMContentLoaded', () => {
      renderBoard();
    });

    function saveData() {
      localStorage.setItem('crm_leads_data', JSON.stringify(leads));
      renderBoard();
    }

    function renderBoard() {
      const searchInput = document.getElementById('searchInput');
      const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const clearBtn = document.getElementById('clearSearchBtn');

      const categoryFilter = document.getElementById('categoryFilter');
      const selectedCategory = categoryFilter ? categoryFilter.value : 'ALL';

      if (clearBtn) {
        if (searchTerm.length > 0) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }

      const stages = ['sin_contactar', 'nuevo', 'seguimiento', 'propuesta', 'negociacion', 'ganado', 'sin_respuesta'];
      
      stages.forEach(stage => {
        const col = document.getElementById(`col-${stage}`);
        if(col) col.innerHTML = '';
      });

      let totalVal = 0;
      let countWon = 0;
      let totalFilteredLeads = 0;

      leads.forEach(lead => {
        const matchesCategory = (selectedCategory === 'ALL') || (lead.category === selectedCategory);

        const matchName = String(lead.name || '').toLowerCase().includes(searchTerm);
        const matchPhone = String(lead.phone || '').toLowerCase().includes(searchTerm);
        const matchInsta = String(lead.instagram || '').toLowerCase().includes(searchTerm);
        const matchCat = String(lead.category || '').toLowerCase().includes(searchTerm);
        const matchNotes = String(lead.notes || '').toLowerCase().includes(searchTerm);
        const matchesSearch = (searchTerm === '' || matchName || matchPhone || matchInsta || matchCat || matchNotes);

        if (matchesCategory && matchesSearch) {
          totalFilteredLeads++;
          totalVal += Number(lead.value || 0);
          if (lead.stage === 'ganado') countWon++;

          const card = createCardElement(lead);
          const col = document.getElementById(`col-${lead.stage}`);
          if (col) col.appendChild(card);
        }
      });

      stages.forEach(stage => {
        const count = leads.filter(l => {
          const catOk = (selectedCategory === 'ALL') || (l.category === selectedCategory);
          const searchOk = searchTerm === '' || 
            String(l.name || '').toLowerCase().includes(searchTerm) ||
            String(l.phone || '').toLowerCase().includes(searchTerm) ||
            String(l.instagram || '').toLowerCase().includes(searchTerm) ||
            String(l.category || '').toLowerCase().includes(searchTerm) ||
            String(l.notes || '').toLowerCase().includes(searchTerm);
          return l.stage === stage && catOk && searchOk;
        }).length;

        const elem = document.getElementById(`count-${stage}`);
        if(elem) elem.innerText = count;
      });

      document.getElementById('stat-total').innerText = totalFilteredLeads;
      document.getElementById('stat-value').innerText = `$${totalVal.toLocaleString()}`;
      document.getElementById('stat-won').innerText = countWon;
      
      const rate = totalFilteredLeads > 0 ? Math.round((countWon / totalFilteredLeads) * 100) : 0;
      document.getElementById('stat-rate').innerText = `${rate}%`;
    }

    function clearSearch() {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      renderBoard();
    }

    function createCardElement(lead) {
      const card = document.createElement('div');
      
      let bentoStyles = {
        bg: "bg-gradient-to-tr from-fuchsia-600 via-pink-500 to-rose-500 text-white border-0 shadow-sm",
        iconBg: "bg-white/20 text-white",
        tagBg: "bg-white/20 text-white border-white/30",
        priceColor: "text-white font-extrabold",
        descColor: "text-white/90",
        btnBg: "bg-white/20 hover:bg-white/30 text-white border-white/30"
      };

      if (lead.stage === 'nuevo') {
        bentoStyles = {
          bg: "bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white border-0 shadow-sm",
          iconBg: "bg-white/20 text-white",
          tagBg: "bg-white/20 text-white border-white/30",
          priceColor: "text-white font-extrabold",
          descColor: "text-white/90",
          btnBg: "bg-white/20 hover:bg-white/30 text-white border-white/30"
        };
      } else if (lead.stage === 'seguimiento') {
        bentoStyles = {
          bg: "bg-gradient-to-br from-sky-500 via-blue-600 to-indigo-600 text-white border-0 shadow-sm",
          iconBg: "bg-white/20 text-white",
          tagBg: "bg-white/20 text-white border-white/30",
          priceColor: "text-white font-extrabold",
          descColor: "text-white/90",
          btnBg: "bg-white/20 hover:bg-white/30 text-white border-white/30"
        };
      } else if (lead.stage === 'propuesta') {
        bentoStyles = {
          bg: "bg-[#FEF6DB] text-amber-950 border border-amber-200/60 shadow-sm",
          iconBg: "bg-amber-400/30 text-amber-900",
          tagBg: "bg-amber-200/50 text-amber-900 border-amber-300/40",
          priceColor: "text-amber-900 font-extrabold",
          descColor: "text-amber-800/80",
          btnBg: "bg-amber-200/60 hover:bg-amber-300/60 text-amber-900 border-amber-300/50"
        };
      } else if (lead.stage === 'negociacion') {
        bentoStyles = {
          bg: "bg-[#E1F9F0] text-emerald-950 border border-emerald-200/60 shadow-sm",
          iconBg: "bg-emerald-400/30 text-emerald-900",
          tagBg: "bg-emerald-200/50 text-emerald-900 border-emerald-300/40",
          priceColor: "text-emerald-900 font-extrabold",
          descColor: "text-emerald-800/80",
          btnBg: "bg-emerald-200/60 hover:bg-emerald-300/60 text-emerald-900 border-emerald-300/50"
        };
      } else if (lead.stage === 'ganado') {
        bentoStyles = {
          bg: "bg-gradient-to-tr from-amber-400 via-rose-400 to-pink-500 text-white border-0 shadow-sm",
          iconBg: "bg-white/20 text-white",
          tagBg: "bg-white/20 text-white border-white/30",
          priceColor: "text-white font-extrabold",
          descColor: "text-white/90",
          btnBg: "bg-white/20 hover:bg-white/30 text-white border-white/30"
        };
      } else if (lead.stage === 'sin_respuesta') {
        bentoStyles = {
          bg: "bg-slate-100 text-slate-700 border border-slate-200 shadow-sm",
          iconBg: "bg-slate-200 text-slate-600",
          tagBg: "bg-slate-200 text-slate-600 border-slate-300",
          priceColor: "text-slate-700 font-bold",
          descColor: "text-slate-500",
          btnBg: "bg-slate-200 hover:bg-slate-300 text-slate-700 border-slate-300"
        };
      }

      card.className = `${bentoStyles.bg} rounded-[24px] p-3.5 shadow-sm hover:shadow-md transition-all cursor-grab active:cursor-grabbing relative group`;
      card.draggable = true;
      card.ondragstart = (e) => drag(e, lead.id);

      const cleanPhone = String(lead.phone || '').replace(/[^0-9]/g, '');
      const waUrl = `https://wa.me/${cleanPhone}`;
      const category = lead.category || 'General';

      let catIcon = "fa-tag";
      if (category === 'Salud') catIcon = "fa-user-doctor";
      if (category === 'Gastronomía' || category === 'Comidas') catIcon = "fa-utensils";
      if (category === 'Entretenimiento') catIcon = "fa-masks-theater";
      if (category === 'Comercio') catIcon = "fa-bag-shopping";
      if (category === 'Servicios') catIcon = "fa-briefcase";

      const rawInsta = (lead.instagram || '').trim();
      const cleanInsta = rawInsta.startsWith('@') ? rawInsta : (rawInsta ? `@${rawInsta}` : '');
      const instaUrl = cleanInsta ? `https://instagram.com/${cleanInsta.replace('@', '')}` : '';

      const followStep = lead.followStep || '1';

      card.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-2">
          <div class="w-8 h-8 rounded-xl ${bentoStyles.iconBg} flex items-center justify-center">
            <i class="fa-solid ${catIcon} text-xs"></i>
          </div>
          
          <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
            <button onclick="editLead('${lead.id}')" class="text-xs p-1 hover:scale-110 transition-transform" title="Editar">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="deleteLead('${lead.id}')" class="text-xs p-1 hover:scale-110 transition-transform" title="Eliminar">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>

        <div class="mb-2">
          <div class="flex items-center gap-1.5 flex-wrap mb-1">
            <span class="inline-block text-[9px] font-bold uppercase tracking-wider ${bentoStyles.tagBg} border px-2 py-0.5 rounded-full">
              ${escapeHtml(category)}
            </span>
            ${lead.stage === 'seguimiento' ? `
              <button onclick="toggleFollowStep('${lead.id}')" class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full ${bentoStyles.tagBg} border cursor-pointer hover:scale-105 transition-transform" title="Clic para cambiar entre Seguimiento 1 y 2">
                Seguimiento ${followStep}
              </button>
            ` : ''}
          </div>
          
          <h4 class="font-extrabold text-sm leading-tight tracking-tight">${escapeHtml(lead.name)}</h4>
          
          ${cleanInsta ? `
            <a href="${instaUrl}" target="_blank" class="inline-flex items-center gap-1.5 text-[11px] font-bold mt-1.5 px-2 py-0.5 rounded-lg ${bentoStyles.tagBg} border hover:opacity-90 transition-opacity">
              <i class="fa-brands fa-instagram text-xs"></i> ${escapeHtml(cleanInsta)}
            </a>
          ` : ''}
        </div>
        
        ${lead.notes ? `<p class="text-[11px] ${bentoStyles.descColor} font-medium mb-2.5 line-clamp-2 leading-relaxed">${escapeHtml(lead.notes)}</p>` : ''}
        
        <div class="flex items-center justify-between pt-2.5 border-t border-black/10 text-xs">
          <span class="${bentoStyles.priceColor} text-xs">$${Number(lead.value || 0).toLocaleString()}</span>
          
          <div class="flex items-center gap-1">
            <a href="${waUrl}" target="_blank" onclick="autoMoveToContacted('${lead.id}')" class="inline-flex items-center gap-1 ${bentoStyles.btnBg} border px-2 py-1 rounded-xl font-bold transition-all text-[10px]">
              <i class="fa-brands fa-whatsapp text-xs"></i> Chat
            </a>
            
            <select onchange="moveLead('${lead.id}', this.value)" class="bg-black/10 text-current border-0 rounded-xl px-1 py-1 text-[9px] font-bold focus:outline-none cursor-pointer">
              <option value="sin_contactar" class="text-slate-800" ${lead.stage === 'sin_contactar' ? 'selected' : ''}>Por Contactar</option>
              <option value="nuevo" class="text-slate-800" ${lead.stage === 'nuevo' ? 'selected' : ''}>Contacto</option>
              <option value="seguimiento" class="text-slate-800" ${lead.stage === 'seguimiento' ? 'selected' : ''}>Seguimiento</option>
              <option value="propuesta" class="text-slate-800" ${lead.stage === 'propuesta' ? 'selected' : ''}>Demo</option>
              <option value="negociacion" class="text-slate-800" ${lead.stage === 'negociacion' ? 'selected' : ''}>Negociación</option>
              <option value="ganado" class="text-slate-800" ${lead.stage === 'ganado' ? 'selected' : ''}>Ganado</option>
              <option value="sin_respuesta" class="text-slate-800" ${lead.stage === 'sin_respuesta' ? 'selected' : ''}>Sin Resp.</option>
            </select>
          </div>
        </div>
      `;

      return card;
    }

    function toggleFollowStep(id) {
      const lead = leads.find(l => l.id === id);
      if (lead) {
        lead.followStep = lead.followStep === '2' ? '1' : '2';
        saveData();
      }
    }

    function autoMoveToContacted(id) {
      const lead = leads.find(l => l.id === id);
      if (lead && lead.stage === 'sin_contactar') {
        lead.stage = 'nuevo';
        saveData();
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          let countAdded = 0;
          
          results.data.forEach(row => {
            const name = row.Nombre || row.nombre || row.Empresa || row.empresa || row.Cliente || row.cliente;
            const phone = row.WhatsApp || row.whatsapp || row.Telefono || row.telefono || row.Celular || row.celular || row.Phone;
            const instagram = row.Instagram || row.instagram || row.Insta || row.insta || row.Redes || row.redes || '';
            const value = row.Valor || row.valor || row.Monto || row.monto || 0;
            const category = row.Categoria || row.categoria || row.Nicho || row.nicho || 'Gastronomía';
            const notes = row.Observaciones || row.observaciones || row.Notas || row.notas || row.Detalles || row.detalles || '';

            if (name && phone) {
              leads.push({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                name: String(name).trim(),
                phone: String(phone).trim(),
                instagram: String(instagram).trim(),
                value: Number(value) || 0,
                category: String(category).trim(),
                stage: 'sin_contactar',
                followStep: '1',
                notes: String(notes).trim()
              });
              countAdded++;
            }
          });

          if (countAdded > 0) {
            saveData();
            alert(`¡Se importaron con éxito ${countAdded} prospectos!`);
          } else {
            alert('No se encontraron filas válidas en el archivo CSV.');
          }
          
          event.target.value = '';
        },
        error: function(err) {
          alert('Error al procesar el archivo CSV.');
        }
      });
    }

    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev, id) { ev.dataTransfer.setData("text/plain", id); }
    function drop(ev, newStage) {
      ev.preventDefault();
      const id = ev.dataTransfer.getData("text/plain");
      moveLead(id, newStage);
    }

    function moveLead(id, newStage) {
      leads = leads.map(l => l.id === id ? { ...l, stage: newStage } : l);
      saveData();
    }

    function openModal() {
      document.getElementById('leadForm').reset();
      document.getElementById('leadId').value = '';
      document.getElementById('modalTitle').innerText = 'Agregar Nuevo Prospecto';
      document.getElementById('leadModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('leadModal').classList.add('hidden');
    }

    function editLead(id) {
      const lead = leads.find(l => l.id === id);
      if (!lead) return;

      document.getElementById('leadId').value = lead.id;
      document.getElementById('leadName').value = lead.name;
      document.getElementById('leadPhone').value = lead.phone;
      document.getElementById('leadInstagram').value = lead.instagram || '';
      document.getElementById('leadValue').value = lead.value;
      document.getElementById('leadCategory').value = lead.category || 'Gastronomía';
      document.getElementById('leadStage').value = lead.stage;
      document.getElementById('leadFollowStep').value = lead.followStep || '1';
      document.getElementById('leadNotes').value = lead.notes || '';

      document.getElementById('modalTitle').innerText = 'Editar Prospecto';
      document.getElementById('leadModal').classList.remove('hidden');
    }

    function saveLead(e) {
      e.preventDefault();
      const id = document.getElementById('leadId').value;
      const name = document.getElementById('leadName').value;
      const phone = document.getElementById('leadPhone').value;
      const instagram = document.getElementById('leadInstagram').value;
      const value = document.getElementById('leadValue').value;
      const category = document.getElementById('leadCategory').value;
      const stage = document.getElementById('leadStage').value;
      const followStep = document.getElementById('leadFollowStep').value;
      const notes = document.getElementById('leadNotes').value;

      if (id) {
        leads = leads.map(l => l.id === id ? { ...l, name, phone, instagram, value, category, stage, followStep, notes } : l);
      } else {
        leads.push({
          id: Date.now().toString(),
          name,
          phone,
          instagram,
          value,
          category,
          stage,
          followStep,
          notes
        });
      }

      saveData();
      closeModal();
    }

    function deleteLead(id) {
      if (confirm('¿Estás seguro de que deseas eliminar este prospecto?')) {
        leads = leads.filter(l => l.id !== id);
        saveData();
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text || '').replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
